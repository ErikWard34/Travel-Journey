<svg
    xmlns="http://www.w3.org/2000/svg"
    width="52"
    height="68"
    viewBox="0 0 26 34"
    shape-rendering="crispEdges"
>

    <!-- Staff -->
    <rect x="1" y="12" width="24" height="1" fill="#5b371d"/>
    <rect x="2" y="11" width="1" height="3" fill="#8b5a2b"/>

    <!-- Hair -->
    <rect x="9" y="4" width="8" height="1" fill="#4a2a17"/>
    <rect x="7" y="5" width="12" height="7" fill="#6b3b1e"/>

    <!-- Face -->
    <rect x="8" y="6" width="10" height="6" fill="#e1b58a"/>

    <!-- Hair sides -->
    <rect x="8" y="6" width="2" height="2" fill="#6b3b1e"/>
    <rect x="16" y="6" width="2" height="2" fill="#6b3b1e"/>

    <!-- Blue eyes -->
    <rect x="10" y="8" width="1" height="1" fill="#4d8dcc"/>
    <rect x="15" y="8" width="1" height="1" fill="#4d8dcc"/>

    <!-- Beard -->
    <rect x="9" y="10" width="8" height="3" fill="#5a321c"/>
    <rect x="11" y="12" width="4" height="1" fill="#5a321c"/>

    <!-- White martial arts uniform -->
    <rect x="8" y="13" width="10" height="10" fill="#f5f5ef"/>

    <!-- Arms -->
    <rect x="6" y="15" width="3" height="7" fill="#f5f5ef"/>
    <rect x="17" y="15" width="3" height="7" fill="#f5f5ef"/>

    <!-- Black belt -->
    <rect x="8" y="19" width="10" height="2" fill="#171717"/>

    <!-- Belt knot -->
    <rect x="12" y="19" width="2" height="2" fill="#b7a36c"/>

    <!-- Legs -->
    <rect x="9" y="23" width="3" height="8" fill="#f5f5ef"/>
    <rect x="14" y="23" width="3" height="8" fill="#f5f5ef"/>

    <!-- Feet -->
    <rect x="8" y="31" width="5" height="2" fill="#222"/>
    <rect x="14" y="31" width="5" height="2" fill="#222"/>

</svg>
